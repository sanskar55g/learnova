<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Register — Student Learning Portal</title>
  <style>
    :root{
      --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card: #ffffff;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #1f2937;
      --shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    body{
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .register-container{
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1{
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle{
      color: #6b7280;
      margin: 0 0 32px;
      font-size: 16px;
    }
    .form-group{
      margin: 20px 0;
      text-align: left;
    }
    label{
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input, select{
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s ease;
      box-sizing: border-box;
    }
    input:focus, select:focus{
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    .register-btn{
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 24px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .register-btn:hover{
      background: linear-gradient(135deg, var(--accent-hover), #7c3aed);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }
    .back-link{
      margin-top: 20px;
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .back-link:hover{
      text-decoration: underline;
    }
    .error{
      color: #ef4444;
      margin-top: 16px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h1>Join Learnova</h1>
    <p class="subtitle">Create your account</p>
    <form id="registerForm">
      <div class="form-group">
        <label for="role">Register as:</label>
        <select id="role" required>
          <option value="">Select Role</option>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
        </select>
      </div>
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" required placeholder="Choose a username" />
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" required placeholder="Create a password" />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" id="confirmPassword" required placeholder="Confirm your password" />
      </div>
      <button type="submit" class="register-btn">Register</button>
    </form>
    <a href="login.html" class="back-link">Already have an account? Login</a>
    <p class="error" id="errorMsg"></p>
  </div>

  <script>
    const registerForm = document.getElementById('registerForm');
    const errorMsg = document.getElementById('errorMsg');

    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const role = document.getElementById('role').value;
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (!role) {
        errorMsg.textContent = 'Please select a role.';
        return;
      }

      if (password !== confirmPassword) {
        errorMsg.textContent = 'Passwords do not match.';
        return;
      }

      if (password.length < 6) {
        errorMsg.textContent = 'Password must be at least 6 characters.';
        return;
      }

      // Load existing users
      const users = JSON.parse(localStorage.getItem('users') || '[]');

      // Check if username exists
      if (users.some(u => u.username === username)) {
        errorMsg.textContent = 'Username already exists.';
        return;
      }

      // Add new user
      users.push({ role, username, password });
      localStorage.setItem('users', JSON.stringify(users));

      // Set session
      localStorage.setItem('userRole', role);
      localStorage.setItem('username', username);

      // Redirect based on role
      if (role === 'student') {
        window.location.href = 'teachers.html';
      } else {
        window.location.href = 'teacher-profile.html';
      }
    });
  </script>
</body>
</html>
