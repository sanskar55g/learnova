<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Student Learning Portal</title>
  <style>
    :root{
      --bg: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      --card: #ffffff;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #1f2937;
      --shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    body{
      font-family: 'Inter', 'Segoe UI', sans-serif;
      background: var(--bg);
      background-attachment: fixed;
      margin: 0;
      padding: 0;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container{
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 40px;
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h1{
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .subtitle{
      color: #6b7280;
      margin: 0 0 32px;
      font-size: 16px;
    }
    .form-group{
      margin: 20px 0;
      text-align: left;
      position: relative;
    }
    .password-container {
      position: relative;
    }
    .password-container input {
      padding-right: 50px;
    }
    .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 14px;
      padding: 5px;
    }
    label{
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }
    input, select{
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 16px;
      transition: border-color 0.3s ease;
      box-sizing: border-box;
    }
    input:focus, select:focus{
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    .login-btn{
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: #fff;
      border: none;
      padding: 14px 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin-top: 24px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .login-btn:hover{
      background: linear-gradient(135deg, var(--accent-hover), #7c3aed);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }
    .error{
      color: #ef4444;
      margin-top: 16px;
      font-size: 14px;
    }
    .register-link{
      margin-top: 20px;
      display: inline-block;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .register-link:hover{
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h1>Learnova</h1>
    <p class="subtitle">Student Learning Portal</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="role">Login as:</label>
        <select id="role" required>
          <option value="">Select Role</option>
          <option value="student">Student</option>
          <option value="teacher">Teacher</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" required placeholder="Enter username" />
      </div>
      <div class="form-group">
        <label for="password">Password:</label>
        <div class="password-container">
          <input type="password" id="password" required placeholder="Enter password" />
          <button type="button" class="toggle-password" onclick="togglePassword('password')">Show</button>
        </div>
      </div>
      <button type="submit" class="login-btn">Login</button>
    </form>
    <a href="register.html" class="register-link">Don't have an account? Register</a>
    <p class="error" id="errorMsg"></p>
  </div>

  <script>
    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      const button = input.nextElementSibling;
      if (input.type === 'password') {
        input.type = 'text';
        button.textContent = 'Hide';
      } else {
        input.type = 'password';
        button.textContent = 'Show';
      }
    }

    const loginForm = document.getElementById('loginForm');
    const errorMsg = document.getElementById('errorMsg');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const role = document.getElementById('role').value;
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      if (!role) {
        errorMsg.textContent = 'Please select a role.';
        return;
      }

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ username, password, role }),
        });

        const data = await response.json();

        if (data.success) {
          // Store user session info
          localStorage.setItem('currentUser', JSON.stringify(data.user));
          localStorage.setItem('userRole', role);
          localStorage.setItem('username', username);

          // Redirect based on role
          if (role === 'student') {
            window.location.href = 'teachers.html';
          } else if (role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            // Check if teacher profile exists (this might need to be updated)
            window.location.href = 'teacher-dashboard.html';
          }
        } else {
          errorMsg.textContent = data.error || 'Login failed';
        }
      } catch (error) {
        console.error('Login error:', error);
        errorMsg.textContent = 'Network error. Please try again.';
      }
    });
  </script>
</body>
</html>
